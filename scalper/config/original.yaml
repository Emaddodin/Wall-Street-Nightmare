  generations: 3
  population: 5
  min_trades: 8
  min_wr: 0.55
  min_avg_r: 0.15
  min_pf: 1.3
  max_dd_pct: 25.0
  backtest_days: 6
  coins_per_class: 6
  adopt: false
  adopt_margin: 0.1
brain:
