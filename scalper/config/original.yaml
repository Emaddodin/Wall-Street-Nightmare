# PRISTINE BASELINE -- the operator's original spec, no R&D knobs.
# Regenerated 2026-09-11 for the from-scratch strategy program.
timeframes:
  htf: 15m
  entry: 1m
universe:
  top_n: 15
  min_volume_usdt_24h: 2000000
  max_spread_bps: 8.0
  min_book_usdt: 50000
  min_atr_pct: 0.15
  min_history_days: 10
  rank_weights:
    liquidity: 0.15
    volume: 0.2
    volatility: 0.35
    trend: 0.2
    spread: 0.1
  volatility_cap_atr_pct: 25.0
strategy:
  internal_swing_threshold_atr: 8.0
  internal_swing_lookback: 20
  value_area_pct: 0.7
  vp_bins: 60
  vp_window_bars: 96
  vp_touch_tol_pct: 0.001
  vp_touch_window_bars: 12
  session:
    asia_sweep_filter: true
    asia_hours_utc:
    - 23.5
    - 5.5
    london_hours_utc:
    - 6.5
    - 9.5
    prime_hours_utc:
    - 9.5
    - 14.5
    trade_windows:
    - any
    windows_utc:
      ny_asia_transition:
      - 20.5
      - 23.5
      asia_low_vol:
      - 23.5
      - 5.5
      pre_london:
      - 5.5
      - 6.5
      london_open:
      - 6.5
      - 9.5
      prime:
      - 9.5
      - 14.5
      ny:
      - 14.5
      - 17.5
      low_liquidity:
      - 17.5
      - 20.5
  entry_models:
  - order_block
  - fvg
  - micro_poc
  ob_max_age_bars: 30
  fvg_max_age_bars: 20
  cvd_filter:
    enabled: false
    lookback: 60
    min_abs: 0.05
  cycle_filter:
    enabled: false
    max_phase: 0.6
    atr_expand_min: 0.5
  require_displacement: false
  pattern_confirm:
    enabled: false
    min_wick_ratio: 2.0
  limit_entry_max_pct: 0.5
  limit_expiry_bars: 4
strategies:
  enabled:
  - vp
  - breakout
  - turtle
  breakout:
    range_bars: 48
    range_pct: 0.1
  turtle:
    wick_frac: 0.6
    tol_pct: 0.0004
    fresh_bars: 12
stop:
  atr_buffer_mult: 0.2
  max_sl_pct: 2.0
  min_sl_atr_mult: 0.0
  max_sl_atr_mult: 3.0
  atr_period: 14
tp:
  model: D
  fixed_r: 2.0
  partial:
    tp1_r: 1.0
    tp1_frac: 0.5
    tp2_r: 2.0
    tp2_frac: 0.25
    runner_frac: 0.25
    runner_exit: trail
    runner_timeout_bars: 0
  structure:
    first_frac: 0.5
    runner_timeout_bars: 0
    runner_frac: 0.5
    runner_exit: bos
trailing:
  breakeven_at_r: 0.0              # move stop to entry after +0.0R (R&D)
  breakeven_after_tp1: true
  trail_tf: 1m
  trail_arm: 2
  trail_offset_atr_mult: 0.1
  only_after_tp1: true
risk:
  max_risk_kelly_pct: 0.0         # hard cap on risk/trade (survival; 0=off)
  risk_per_trade: 0.25
  leverage_cap: 50
  max_positions: 1
  max_corr: 0.7
  corr_window_bars: 240
  min_order_notional_usdt: 20
daily:
  loss_limit_pct: 0.5
  target_pct: 1.0
  max_consecutive_losses: 2
  cooldown_after_losses: 1
  cooldown_minutes: 30
  max_trades_per_day: 5
  day_start_hour_utc: 0
volatility_filter:
  enabled: true
  atr_zscore_max: 4.0
  history_hours: 24
  spread_abnormal_bps: 15.0
execution:
  fee_bps: 6.0
  maker_fee_bps: 2.0
  slippage_bps: 2.0
  entry_at: next_open
  exit_slippage_adverse: true
  intrabar_sl_first: true
  max_fee_r: 2.0
paper:
  starting_equity: 100.0
  poll_seconds: 15
  day_start_hour_utc: 0
  feed_symbols: 20
  archive_days: 7
  rebuild_days: 10
  max_signal_age_ms: 300000
  max_fill_age_bars: 3
lessons:
  autopilot_enabled: false
  autopilot_enabled_from_ms: 1789084800000
app:
  port: 8443
  host: 0.0.0.0
  session_hours: 2
  certfile: /etc/letsencrypt/live/62.60.198.135.nip.io/fullchain.pem
  keyfile: /etc/letsencrypt/live/62.60.198.135.nip.io/privkey.pem
  title: Scalper
goal:
  start_equity: 100.0
  target_equity: 100000.0
  days: 10
backtest:
  warmup_15m_bars: 500
  universe_rebalance: daily
walkforward:
  train_days: 60
  val_days: 20
  test_days: 20
research:
  log_all_scores: true
  log_reject_min_legs: 2
  outcome_window_bars: 240
inventor:
