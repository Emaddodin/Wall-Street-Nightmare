# ============================================================================
# AGGRESSIVE profile -- the daily +100% KPI table (VP scalper edition).
# Overrides only; everything else comes from default.yaml.
# ============================================================================

universe:
  top_n: 15

strategy:
  entry_models: [order_block, fvg, micro_poc]
  session:
    trade_windows: [ny, prime]   # the 50% lineage traded only NY x prime
  cvd_filter:
    enabled: true     # volume-delta must agree with the trade (web edge)
    lookback: 60
    min_abs: 0.05
  cycle_filter:
    enabled: true     # relaxed to the 50% lineage: phase 0.6, expansion 0.5
    max_phase: 0.6
    atr_expand_min: 0.5
  require_displacement: false   # too strict -- killed trade count (hunt r3)
  pattern_confirm:
    enabled: false    # too strict -- killed trade count (hunt r3)
    min_wick_ratio: 2.0

stop:
  atr_buffer_mult: 0.2
  min_sl_atr_mult: 0.25   # knife-catch guard: stop >= N x 1m ATR (relaxed)
  max_sl_atr_mult: 3.0
  max_sl_pct: 2.0

tp:
  model: D

trailing:
  breakeven_at_r: 0.0              # move stop to entry after +0.0R (R&D)
  breakeven_after_tp1: true
  only_after_tp1: true

risk:
  max_risk_kelly_pct: 0.0         # hard cap on risk/trade (survival; 0=off)
  risk_per_trade: 0.25            # two 2R wins = +100% = daily target
  leverage_cap: 50

lessons:
  autopilot_enabled: false        # operator 2026-09-10 evening: all strategies hunt
  autopilot_enabled_from_ms: 1789084800000   # re-enable at 03:30 Tehran (2026-09-11 00:00 UTC)

daily:
  loss_limit_pct: 0.50
  target_pct: 1.0          # +100% of day-start equity -> halt (operator reinstated 2026-09-09)
  max_consecutive_losses: 2
  cooldown_after_losses: 1
  cooldown_minutes: 0
  max_trades_per_day: 5

volatility_filter:
  enabled: true
  atr_zscore_max: 4.0

execution:
  fee_bps: 6.0
  slippage_bps: 2.0
  max_fee_r: 1.0   # friction <= 1R: tight stops eat fees

paper:
  starting_equity: 100.0
  feed_symbols: 20

goal:
  start_equity: 100.0
  target_equity: 100000.0
  days: 10

# --- the lab (ai strategy inventor) -------------------------------------------
inventor:
  enabled: true
  generations: 3
  population: 5
  min_trades: 8          # an idea needs this many closed trades to count
  min_wr: 0.55           # ... and this win rate
  min_avg_r: 0.15        # ... and this expectancy per R
  min_pf: 1.3            # ... and this profit factor
  max_dd_pct: 25.0       # ... and no deeper drawdown than this
  backtest_days: 6
  coins_per_class: 6     # majors + mids + micros per lab run
  adopt: false           # auto-swap live config? OFF until it proves itself
  adopt_margin: 0.10     # must beat the champion by at least 10% on score

# --- the brain (learned win-probability trade filter) --------------------------
brain:
  enabled: true           # the gate consults the trained model before a fill
  veto_prob: 0.50         # the 76%-wr band (night retrain lifts)
  min_keep_frac: 0.15     # selectivity mode: veto up to 85% of signals
  min_train_trades: 1000  # trust only the big brain
