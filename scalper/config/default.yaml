# ============================================================================
# VOLUME PROFILE + MARKET STRUCTURE SCALPING BOT -- configuration
# (replaces the previous confluence strategy entirely; TESLA is gone)
#
# Every parameter lives here.  The engine validates every field on load.
# ============================================================================

# --- timeframes ---------------------------------------------------------------
timeframes:
  htf: 15m          # market structure bias + swing range for the profile
  entry: 1m         # confirmation (ChoCH) + entry models (OB / FVG / micro POC)

# --- universe selection -------------------------------------------------------
universe:
  top_n: 15
  min_volume_usdt_24h: 2000000
  max_spread_bps: 8.0
  min_book_usdt: 50000
  min_atr_pct: 0.15
  min_history_days: 10
  rank_weights:
    liquidity: 0.15
    volume: 0.20
    volatility: 0.35
    trend: 0.20
    spread: 0.10
  volatility_cap_atr_pct: 25.0

# --- strategy: volume profile + market structure (the system prompt) ----------
strategy:
  # Phase 1 -- daily bias
  internal_swing_threshold_atr: 8.0   # 15m swing leg wider than this x ATR15
                                      # -> too large to trade the swing; use
                                      # the INTERNAL structure (last ChoCH)
  internal_swing_lookback: 20         # bars scanned for internal swings
  # Phase 2 -- volume profile
  value_area_pct: 0.70                # 70% of volume = the Value Area
  vp_bins: 60                         # price bins between swing high/low
  vp_window_bars: 96                  # last 24h of 15m bars inside the range
  vp_touch_tol_pct: 0.0010            # a bar within 10 bps of a level "touches" (loosened 2026-09-09)
  # The operator's phases 2 and 3 are SEQUENTIAL: price reaches the VP
  # level, and only then do you drop to the 1m and wait for the structure
  # to shift.  This is how many closed 1m bars back the touch may have
  # happened and still count.  1 = the original same-bar conjunction, which
  # required the ChoCH candle itself to straddle the level.
  vp_touch_window_bars: 12
  # session liquidity filter (operator's Tehran session map, in UTC)
  session:
    asia_sweep_filter: true           # in the London-open window: no trade
    asia_hours_utc: [23.5, 5.5]       # until the Asia high/low was swept
    london_hours_utc: [6.5, 9.5]      # London open (10:00-13:00 Tehran)
    prime_hours_utc: [9.5, 14.5]      # LONDON x NY PRIME (13:00-18:00 Tehran)
    trade_windows: [any]              # trade all 24h (operator 2026-09-09):
                                      # prime | london_open | ny | any
    windows_utc:                      # the full session map (labels only)
      ny_asia_transition: [20.5, 23.5]
      asia_low_vol: [23.5, 5.5]
      pre_london: [5.5, 6.5]
      london_open: [6.5, 9.5]
      prime: [9.5, 14.5]
      ny: [14.5, 17.5]
      low_liquidity: [17.5, 20.5]
  # Phase 4 -- entry models (ANY one confirms the 1m ChoCH)
  entry_models: [order_block, fvg, micro_poc]
  ob_max_age_bars: 30
  fvg_max_age_bars: 20
  cvd_filter:
    enabled: false    # volume-delta must agree with the trade
    lookback: 60
    min_abs: 0.05
  cycle_filter:
    enabled: false
    max_phase: 0.4
    atr_expand_min: 0.0
  require_displacement: false
  pattern_confirm:
    enabled: false
    min_wick_ratio: 2.0
  limit_entry_max_pct: 0.5          # limit at the model level only when the
                                    # level sits within this % of the trigger
                                    # close; farther = market at next open
  limit_expiry_bars: 4              # a resting limit dies after N 1m bars

# --- strategy farm ---------------------------------------------------------------
# The computer advantage: the eagle scans everything, several strategies race
# for the daily target.  Each strategy is independent, deterministic, and
# tagged in every trade record ("strategy" field); risk/target machinery is
# GLOBAL (one book, one daily +100% halt).
strategies:
  enabled: [vp, breakout, turtle]
  breakout:                       # stolgo consolidation breakout
    range_bars: 48                # prior range measured on the 15m (12h)
    range_pct: 0.10               # range width <= 10% of mean close
  sweep:                          # London-open Asia-sweep fade (operator's session map)
    first_r: 1.5
  pullback:                       # from-scratch trend-continuation (R&D)
    ema_len: 20
    slope_bars: 8
    wick_mult: 2.0
    first_r: 1.5
  impulse:                        # from-scratch momentum family (R&D)
    atr_window: 20
    expand_mult: 1.5
    vol_mult: 1.5
    lookback: 30
    body_mult: 1.2
    first_r: 1.5
  turtle:                         # ICT turtle soup (failed-break fade)
    wick_frac: 0.6                # sweep wick >= 60% of bar range
    tol_pct: 0.0004               # EQH/EQL tolerance
    fresh_bars: 12                # a sweep stays tradeable this many 15m bars
  ict_sniper:                     # ICT sniper: sweep -> MSS -> FVG limit retest
    timeframe: 5m                 # 5m | 15m detection timeframe
    arm: 2                        # swing fractal arms (confirmation lag)
    swing_fresh_bars: 30          # the swept swing must be confirmed within N bars
    sweep_max_age: 12             # setup valid N bars after the sweep
    mss_max_gap: 6                # MSS must follow the sweep within N bars
    wick_frac: 0.45               # sweep wick >= 45% of range (relaxed)
    fvg_max_age: 30               # FVG lifetime (bars)
    fvg_mitigation: close         # gap survives wicks; dies on a close
                                  # beyond the CE (partial-mitigation model)
    entry_at: ce                  # limit at the FVG CE ("edge" = zone edge)
    sl_mode: sweep                # SL anchor: sweep wick | fvg_edge | mid
                                  # (mid = FVG edge <-> sweep wick midpoint)
    rr_min: 2.5                   # TP2/SL strictly >= 2.5
    tp_min_bps: 400               # runner (TP2) target (phase-7 spec)
    tp_max_bps: 400
    tp1_bps: 120                  # scale-out: close tp1_frac at +1.2%,
    tp1_frac: 0.75                # runner SL -> breakeven (phase-7 spec)
    be_after_r: 0.75              # pre-scale BE: stop -> entry at +0.75R
    be_to_r: 0.0
    max_sl_bps: 160               # reject SLs wider than this (A+ gate)
    sl_buffer_atr_mult: 0.25      # pad beyond the sweep wick
    time_exit_bars: 80            # runner time kill (5m: 80 = ~6.7h)
    retest_bars: 8                # the limit order's patience (TF bars)

# --- stop loss -----------------------------------------------------------------
stop:
  atr_buffer_mult: 0.25               # SL beyond the recent 1m swing + ATR buffer
  max_sl_pct: 1.5
  min_sl_atr_mult: 0.0   # knife-catch guard: stop >= N x 1m ATR
  max_sl_atr_mult: 3.0
  atr_period: 14

# --- take profit ---------------------------------------------------------------
tp:
  model: D                            # D = structure target + trailing runner
  fixed_r: 2.0                        # model A compatibility
  partial:                            # model B compatibility
    tp1_r: 1.0
    tp1_frac: 0.5
    tp2_r: 2.0
    tp2_frac: 0.25
    runner_frac: 0.25
    runner_exit: trail
    runner_timeout_bars: 0
  structure:
    first_frac: 0.5                   # 50% at the nearest opposite 15m swing
    runner_timeout_bars: 0             # 0=off; N = close runner after N 1m bars
    runner_frac: 0.5                  # 50% runner: trails 1m swings, exits on
    runner_exit: bos                  # opposite 1m BOS; BE after the first fill

# --- trailing ------------------------------------------------------------------
trailing:
  breakeven_at_r: 0.0              # move stop to entry after +0.0R (R&D)
  breakeven_after_tp1: true
  trail_tf: 1m
  trail_arm: 2
  trail_offset_atr_mult: 0.1
  only_after_tp1: true

# --- risk ----------------------------------------------------------------------
risk:
  max_risk_kelly_pct: 0.0         # hard cap on risk/trade (survival; 0=off)
  risk_per_trade: 0.25                # 25% of equity per trade
  leverage_cap: 50                    # high enough for 25% risk on tight stops
  max_positions: 1
  max_corr: 0.7
  corr_window_bars: 240
  min_order_notional_usdt: 20

daily:
  loss_limit_pct: 0.50                # -50% of day-start equity -> halt
  target_pct: 1.0                     # +100% of day-start equity -> HALT until
                                      # the next session (the daily KPI)
  max_consecutive_losses: 2
  cooldown_after_losses: 1
  cooldown_minutes: 30
  max_trades_per_day: 10
  day_start_hour_utc: 0

# --- volatility filter ----------------------------------------------------------
volatility_filter:
  enabled: true
  atr_zscore_max: 4.0
  history_hours: 24
  spread_abnormal_bps: 15.0

# --- execution ------------------------------------------------------------------
execution:
  fee_bps: 6.0                  # TAKER: market entries, stops, BOS exits
  # MAKER: a resting limit that fills pays the maker rate, not the taker
  # rate.  The model-priced entries (OB mean threshold / FVG CE / micro-POC)
  # rest as limits, so charging them 6 bps overstated their cost by 4 bps --
  # 0.26R at the measured 0.152% median stop.  Bitunix maker is ~2 bps.
  maker_fee_bps: 2.0
  slippage_bps: 2.0
  entry_at: next_open
  exit_slippage_adverse: true
  intrabar_sl_first: true
  # Fee viability. Round-trip cost = 2*(fee+slip)/1e4 of notional; a stop of
  # `d` (as a fraction of price) risks `d` of notional, so the venue takes
  # 2*(fee+slip)/1e4/d of every R.  Measured on the 130-day farm backtest:
  # the median stop was 0.152% of price = 1.05R of friction per round trip,
  # i.e. the median trade paid more than its entire risk budget to the
  # exchange before the market moved.  Setups tighter than this bound are
  # negative-sum regardless of edge and are refused ("fee_gt_edge").
  # 0.20 => the stop must be at least 0.80% of price at 6+2 bps.
  max_fee_r: 2.0

# --- paper trading --------------------------------------------------------------
paper:
  starting_equity: 100.0
  poll_seconds: 15
  day_start_hour_utc: 0
  feed_symbols: 20
  archive_days: 7
  rebuild_days: 10
  # a closed bar older than this never emits a signal: when a symbol
  # re-enters the feed after hours away, replaying its backlog would
  # generate signals on historical bars and fill them at today's price
  max_signal_age_ms: 300000
  # market fills only within this many bars of the signal bar close
  max_fill_age_bars: 3

# --- self-teaching ----------------------------------------------------------------
lessons:
  autopilot_enabled: true          # auto-pause strategies/models on repeat losses

# --- app ------------------------------------------------------------------------
app:
  port: 8443
  host: 0.0.0.0
  session_hours: 2
  certfile: /etc/letsencrypt/live/62.60.198.135.nip.io/fullchain.pem
  keyfile: /etc/letsencrypt/live/62.60.198.135.nip.io/privkey.pem
  title: Scalper

goal:
  start_equity: 100.0
  target_equity: 100000.0
  days: 10

backtest:
  warmup_15m_bars: 500
  universe_rebalance: daily

walkforward:
  train_days: 60
  val_days: 20
  test_days: 20

research:
  log_all_scores: true
  log_reject_min_legs: 2
  outcome_window_bars: 240

# --- the lab (ai strategy inventor) -------------------------------------------
inventor:
  enabled: true
  generations: 2
  population: 4
  min_trades: 8
  min_wr: 0.55
  min_avg_r: 0.15
  min_pf: 1.3
  max_dd_pct: 25.0
  backtest_days: 6
  coins_per_class: 6
  adopt: false
  adopt_margin: 0.10

# --- the brain (learned win-probability trade filter) --------------------------
brain:
  enabled: true
  veto_prob: 0.40
  min_keep_frac: 0.35
  min_train_trades: 300
