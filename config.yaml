# NOT READ BY ANYTHING.
#
# Verified 2026-09-04: no file in this repository opens, parses or imports
# this document. It describes an earlier Tesla + HMA 1m strategy and the
# numbers in it CONTRADICT what the engine actually runs, which is set on the
# command line in services/stratton-oakmont-paper.service:
#
#                       here            actually running
#   leverage            20              50
#   risk per trade      25%             half the wallet as margin
#   stop                ATR-based       the far side of the broken band
#   target              1.5 R           10% of price
#   timeframe           1m / 15m HMA    15m
#   max positions       5               2 (max_exposure 1.0 at 50% each)
#
# Reading a number out of this file and believing it is what the book is doing
# would be a serious mistake. The live parameters are the ExecStart line of
# the unit, and nothing else. Kept for the measurement notes in the comments.
# ============================================================================

# Tesla + HMA 1m bot configuration.
# Every threshold with a number in a comment was measured, not guessed --
# see README "How the numbers were chosen".

trading:
  mode: paper                # paper | live. Going live also needs --live.
  # cdp    = read badges straight from TradingView Desktop's study data via the
  #          debug port. Exact bar times and prices; window can stay hidden.
  # vision = screenshot + OCR fallback (needs `calibrate --detect-region`).
  signal_source: cdp
  cdp_host: 127.0.0.1
  cdp_port: 9222
  tesla_study_match: TESLA
  margin_coin: USDT
  margin_mode: ISOLATION     # isolated so one bad trade cannot eat the account
  leverage: 20
  paper_starting_equity: 100.0
  slippage_bps: 2.0
  rescan_seconds: 1800       # look for a better-fitting coin every 30 min
  switch_only_when_flat: true
  exchange_prefix: BITUNIX   # chart the same venue you trade
  loop_seconds: 2.0
  position_poll_seconds: 5.0

strategy:
  hma_length: 55             # from the PDF
  hma_timeframe_minutes: 15  # from the PDF
  atr_length: 14
  atr_stop_mult: 1.5         # from the PDF: stop is 1.5 ATR beyond the swing
  swing_left: 3
  swing_right: 3
  # 1.5 kept because it MEASURED best. Backtested across RR 1.0-3.0, only 1.5
  # produced a positive edge (+4.4 pts over break-even, +0.096 R/trade); 2.0
  # and 2.5 were negative. Theory favoured higher RR, but 1m price action
  # mean-reverts, so distant targets do not fill at the random-walk rate.
  risk_reward: 1.5
  taker_fee: 0.0006

  filters:
    # Trade with the 15m trend, not across it.
    hma_slope_min_atr: -0.10
    # Calibrated on 161 REAL Tesla badges (median 4.2 ATR, max 12.4). The old
    # 3.0 came from a backtest proxy that fires on the HMA and rejected 63% of
    # real badges. 8.0 is ~the 90th percentile.
    max_extension_atr: 8.0
    # Stop distance = swing distance (~2.7 ATR) + 1.5 ATR pad. Measured mean
    # 4.35 ATR over 1241 signals, so 8.0 keeps ~96% and 4.0 would cut 54%.
    min_stop_atr: 0.8
    max_stop_atr: 8.0
    min_stop_pct: 0.0008
    # Sanity bound only -- risk is capped by target_risk_pct + leverage, so a
    # wider stop means a smaller position, not more risk. max_stop_atr is the
    # volatility-correct version. 0.02 was the top live blocker.
    max_stop_pct: 0.04
    # After fees a trade must still be worth taking.
    min_net_rr: 1.0
    max_spread_bps: 8.0
    min_atr_pct: 0.0005
    max_atr_pct: 0.03
    max_signal_age_s: 45.0
    require_ha_agreement: true
    require_prior_signal: true   # the PDF sequence rule needs a predecessor

risk:
  # 5%, set from the measured edge rather than preference.
  #
  # With winrate 50.5% and realised RR 1.17 (measured over 103 backtested
  # trades), Kelly-optimal risk is 8.2%. 5% sits just under two-thirds Kelly:
  # near-maximal compounding with far less variance.
  #
  # 25% is not merely riskier -- at this edge its expected log-growth is
  # NEGATIVE (-0.0128/trade). Volatility drag exceeds the edge, so it loses
  # money on average no matter how good the signal is: P(reaching 25k) 9.6%,
  # P(ruin) 90.4%. At 5%: P(25k) 99.5%, P(ruin) 0.1%.
  # Lowering risk here is not caution, it is the only setting that reaches the
  # target at all.
  target_risk_pct: 0.25
  max_leverage: 20
  # At 5% each, five concurrent positions put 25% at risk -- the same total
  # exposure the old single-position 25% setting carried, but spread across
  # uncorrelated symbols and cycling far faster.
  max_concurrent_positions: 5
  max_notional_multiple: null   # null = leverage is the only size authority
  daily_loss_limit_pct: 0.20
  # At 5% risk a 4-loss streak costs only ~18%, and with a ~50% winrate such
  # streaks are routine -- halting on them would stop the compounding the
  # target depends on. The daily loss limit remains the real circuit breaker.
  max_consecutive_losses: 8
  loss_cooldown_minutes: 15
  min_equity_usdt: 10.0
  taker_fee: 0.0006

scan:
  # Widened for sweep coverage: the strategy's own filters reject thin or
  # wide-spread setups per signal, so the universe should be broad.
  min_volume_24h_usdt: 3000000
  max_spread_bps: 8.0
  min_atr_pct: 0.0005
  max_atr_pct: 0.01
  er_window: 30              # must match trade horizon, not a longer trend
  min_efficiency_ratio: 0.30 # ~65th percentile of the live market
  max_hma_crossings_per_100: 5.0
  require_api_support: true
  exclude: []

vision:
  # Run `python run.py calibrate --region X,Y,W,H` -- it writes vision.json,
  # which overrides everything here because it was measured on your display.
  region: null
  trigger_zone_bars: 1.5   # only act on badges <=1.5 bars old (see vision.py)
  bar_width_px: 8.0
  candle_suppress_px: 13
  confirm_with_ocr: true
  poll_seconds: 2.0
  save_debug_frames: false

db_path: data/bot.db
log_level: INFO
