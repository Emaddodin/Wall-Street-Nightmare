<!doctype html>
<html lang="en" dir="ltr" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Gold Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Vazirmatn:wght@400;600&display=swap">
<style>
/* Gold Desk: an analysis desk on the MT5 chart. Nothing on this page places, changes or closes a trade; execution
   is in MT5 on the phone. Desktop: the chart with a dock under it (day map, candle-by-candle feed, news) and the
   decision column on the right (what to do now, overall analysis, models, ICT read, best model, timeframes).
   Phone: what to do first, then the chart, overall, news, the candle feed, the day map and the rest. */
:root {
  --bg: #0e0f11;          /* graphite, faintly warm */
  --panel: #15171a;
  --raise: #1c1f23;
  --line: #262a2f;
  --fg: #ece8df;
  --dim: #8e8a80;
  --gold: #d6ad52;        /* brand and the one line */
  --up: #2fb67c;
  --down: #e5484d;
  --warn: #e8b23a;
  --buy: #2f7bf5;         /* your own MT5 positions only */
  --sell: #e5533c;
  --ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --label: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --dock: clamp(250px, 35vh, 330px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; direction: ltr !important; unicode-bidi: isolate; }
body * { direction: ltr; text-align: left; }   /* RTL browser add-ons and page translation flip alignment too */
button, button * { text-align: center; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
a { color: inherit; }
.up { color: var(--up); } .down { color: var(--down); } .dim { color: var(--dim); } .warnc { color: var(--warn); }
.eyebrow { font: 600 11px var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

/* ---------------- top bar: whose chart it is, live price, analysis only */
header { display: flex; align-items: center; gap: 10px 18px; padding: 0 18px; height: 54px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font: 700 16px var(--label); letter-spacing: .14em; color: var(--gold); }
.brand span { font: 500 13px var(--mono); color: var(--dim); }
.pill { font: 700 11px var(--label); letter-spacing: .1em; padding: 4px 10px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--dim); }
.pill.src.mt5 { color: var(--fg); border-color: rgba(236,232,223,.35); }
.pill.src.demo { color: var(--warn); border-color: rgba(232,178,58,.45); }
.pill.ao { color: var(--gold); border-color: rgba(214,173,82,.5); background: rgba(214,173,82,.07); }
.conn { display: flex; align-items: center; gap: 7px; font: 500 13px var(--label); color: var(--dim); white-space: nowrap; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--down); flex: none; }
.conn.on i { background: var(--up); animation: beat 1.6s ease-out infinite; }
.conn.closed i { background: var(--dim); }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(47,182,124,.5); } 100% { box-shadow: 0 0 0 7px rgba(47,182,124,0); } }
.quote { margin-left: auto; display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.quote b#bid { font: 700 20px var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.quote span { font: 500 12px var(--mono); color: var(--dim); }
.quote span b { color: var(--fg); font-weight: 600; }
.helptop { font: 600 12px var(--mono); color: var(--gold); border: 1px solid rgba(214,173,82,.45); border-radius: 4px; padding: 1px 7px; }
.helptop span { font-family: Vazirmatn, Tahoma, sans-serif; }
.banner { background: rgba(229,72,77,.12); color: #ffb9b5; padding: 8px 18px; font-size: 14px; border-bottom: 1px solid rgba(229,72,77,.35); flex: none; }

/* ---------------- main grid */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 404px; grid-template-rows: minmax(0, 1fr) var(--dock);
  grid-template-areas: "chart side" "dock side"; }
.chartwrap { grid-area: chart; position: relative; min-height: 0; }
#chart { position: absolute; inset: 0; }
#zones { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.dock { grid-area: dock; min-height: 0; border-top: 1px solid var(--line); background: var(--panel); padding: 10px; display: grid; gap: 10px;
  grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); grid-template-areas: "feed news"; }
#feed { grid-area: feed; } #newsBox { grid-area: news; }
#more .sub { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
#more .sub:empty, #more .sub[hidden] { display: none; }
.vo { cursor: pointer; }
.vo .vx { grid-column: 1 / -1; display: none; margin: 4px 0 2px; padding: 6px 9px; border-radius: 8px; background: var(--raise); font-size: 12px; color: #d3cfc5; line-height: 1.45; }
.vo.open .vx { display: block; }
.vo.open .vt { -webkit-line-clamp: unset; display: block; }
.vo .vx .mrow { grid-template-columns: 64px minmax(0, 1fr); }
.twoway { margin: 6px 0; border: 1px solid rgba(232,178,58,.6); background: rgba(232,178,58,.08); color: #ffd98f; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; }
.twoway b { color: var(--warn); }
.fbest.compact { margin: 8px 0 2px; padding: 7px 10px; }
.fbest.compact .fn b.nm { font-size: 15px; }
#feed, #newsBox { min-height: 0; overflow: auto; }
aside { grid-area: side; border-left: 1px solid var(--line); background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow: auto; min-height: 0; }

/* a box: one block of the analysis */
.box { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 13px; min-width: 0; }
.bh { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.bh .eyebrow { flex: none; }
.bh .r { margin-left: auto; font: 500 11.5px var(--mono); color: var(--dim); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.tagp { font: 700 10px var(--label); letter-spacing: .1em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
.tagp.warn { color: var(--warn); border-color: rgba(232,178,58,.5); }
.tagp.ok { color: var(--up); border-color: rgba(47,182,124,.5); }
.tagp.gold { color: var(--gold); border-color: rgba(214,173,82,.5); }
.meta { font-size: 12px; color: var(--dim); line-height: 1.4; }
.say { font-size: 13.5px; line-height: 1.45; color: #dcd8ce; }
details.fold > summary { cursor: pointer; list-style: none; font: 600 12px var(--label); letter-spacing: .04em; color: var(--dim); padding: 4px 0; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "+ "; font-family: var(--mono); }
details.fold[open] > summary::before { content: "− "; }
details.fold > summary:hover { color: var(--fg); }

/* ---------------- chart overlays */
.chartbar { position: absolute; top: 10px; left: 10px; right: 72px; z-index: 3; display: flex; gap: 6px; flex-wrap: wrap; align-items: flex-start; pointer-events: none; }
.chartbar > * { pointer-events: auto; }
.tfs, .ovl { display: flex; gap: 2px; background: rgba(21,23,26,.92); padding: 3px; border-radius: 9px; border: 1px solid var(--line); flex-wrap: wrap; }
.tfs button { padding: 4px 10px; border-radius: 6px; color: var(--dim); font: 600 13px var(--label); }
.tfs button.on { background: var(--raise); color: var(--fg); }
.ovl button { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 6px; color: var(--dim); font: 600 13px var(--label); }
.ovl button.on { background: var(--raise); color: var(--fg); }
.ovl button i { width: 14px; height: 0; border-top: 2.5px solid var(--gold); }
.ovl button i.c { width: 9px; height: 9px; border: 0; border-radius: 50%; background: var(--up); box-shadow: 6px 0 0 -1px var(--down); margin-right: 5px; }
.ovl button i.f { width: 12px; height: 8px; border: 1px solid var(--up); border-top: 2px dashed var(--warn); background: transparent; }
.ovl button i.s { width: 12px; height: 10px; border: 0; border-top: 1px solid var(--warn); border-bottom: 1px dashed var(--fg); background: linear-gradient(rgba(229,72,77,.3) 50%, rgba(47,182,124,.3) 50%); }
.ovl button i.p { width: 14px; height: 0; border-top: 2px solid var(--buy); box-shadow: 0 4px 0 -1px var(--sell); margin-bottom: 4px; }
.ovl button i.fm { width: 14px; height: 0; border-top: 2px dashed var(--up); }
.ovl button i.ict { width: 12px; height: 10px; border: 0; border-left: 2px solid var(--up); background: rgba(214,173,82,.28); }
.ovl button:not(.on) i { opacity: .35; }
.helpbtn { width: 32px; height: 30px; border-radius: 9px; background: rgba(21,23,26,.92); border: 1px solid var(--line); color: var(--dim); font: 700 15px var(--label); }
.helpbtn:hover, .helpbtn.on { color: var(--gold); border-color: rgba(214,173,82,.6); }
.reads { position: absolute; top: 54px; left: 10px; z-index: 3; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; max-width: calc(100% - 140px); pointer-events: none; }
.reads > * { pointer-events: auto; }
.chip0 { max-width: 100%; background: rgba(21,23,26,.92); border: 1px solid var(--line); border-radius: 8px; padding: 3px 9px; font: 500 12.5px var(--label); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip0 b { font-weight: 700; letter-spacing: .05em; margin-right: 5px; }
.tfread { display: flex; gap: 9px; align-items: baseline; }
.tfread .tfa { font: 600 12px var(--mono); color: var(--dim); }
.tfread .tfa b { font-weight: 700; margin-left: 2px; }
.linechip { cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.linechip i { width: 16px; height: 0; border-top: 2.5px solid var(--gold); flex: none; }
.linechip.CONFLICT i, .linechip.FLAT i { border-top: 2px dashed var(--dim); }
.linechip.ICT_ONLY i, .linechip.MODELS_ONLY i { border-top-style: dashed; }
.linechip.AGREE { border-color: rgba(214,173,82,.6); }
.linechip.CONFLICT { color: var(--dim); }
.tip { position: absolute; z-index: 6; max-width: min(360px, calc(100% - 16px)); background: rgba(21,23,26,.97); border: 1px solid var(--line); border-radius: 10px; padding: 8px 11px; font-size: 12.5px; line-height: 1.4; color: #dcd8ce; box-shadow: 0 12px 34px rgba(0,0,0,.5); pointer-events: none; }
.tip b.h { display: block; font: 700 12px var(--label); letter-spacing: .06em; color: var(--fg); margin-bottom: 3px; }
.tip ul { margin: 2px 0 0; padding-left: 15px; }
.tip li { margin: 1px 0; }
.tip .act { margin-top: 4px; font: 600 11.5px var(--mono); color: var(--dim); }
.wrow { display: grid; grid-template-columns: 64px 46px 34px minmax(0, 1fr); gap: 2px 8px; align-items: baseline; font-size: 12px; padding: 2px 0; }
.wrow .n { color: var(--fg); font-weight: 600; } .wrow .w { font: 700 12px var(--mono); text-align: right; } .wrow .d { font: 700 12px var(--mono); text-align: center; }
.wrow .t { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wbar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: var(--raise); margin: 5px 0 3px; }
.wbar i { display: block; height: 100%; }
.wbar .ict { background: var(--gold); } .wbar .kr { background: #8f7be8; } .wbar .qu { background: #4fb3c9; } .wbar .an { background: #3a3e44; }
.lgd { display: flex; flex-wrap: wrap; gap: 3px 10px; font-size: 11px; color: var(--dim); }
.lgd span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; background: var(--c); vertical-align: -1px; }

/* the cheat sheet panel */
.legend { position: absolute; top: 54px; right: 72px; z-index: 7; width: 460px; max-width: calc(100% - 24px); max-height: calc(100% - 66px); display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 18px 50px rgba(0,0,0,.55); }
.legend .fa { direction: rtl; unicode-bidi: isolate; text-align: right; font-family: Vazirmatn, Tahoma, system-ui, sans-serif; color: var(--gold); font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: none; }
.lg-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.lg-head b { font: 700 15px var(--label); letter-spacing: .04em; }
.langs { margin-left: auto; display: flex; gap: 2px; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 2px; }
.langs button { padding: 2px 9px; border-radius: 5px; color: var(--dim); font: 600 12px var(--label); }
.langs button[lang="fa"] { font-family: Vazirmatn, Tahoma, sans-serif; }
.langs button.on { background: var(--raise); color: var(--fg); }
.lg-open { color: var(--dim); text-decoration: none; font-size: 15px; padding: 0 4px; }
.lg-open:hover { color: var(--gold); }
.lg-head #legendClose { width: 28px; height: 28px; border-radius: 7px; color: var(--dim); font-size: 20px; line-height: 1; }
.lg-head button:hover { background: var(--raise); color: var(--fg); }
.lg-body { overflow: auto; padding: 4px 14px 14px; }
.lg-body h3 { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 6px; font: 700 12px var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.lg-note { margin: -2px 0 6px; font-size: 12.5px; color: var(--dim); }
.lg-row { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 12px; align-items: start; padding: 7px 0; border-top: 1px solid rgba(38,42,47,.6); }
.lg-sw { display: flex; align-items: center; min-height: 20px; padding-top: 1px; }
.lg-name { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.lg-name b { font: 600 13.5px var(--mono); color: var(--fg); }
.lg-row p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.4; color: #c9c5bb; }
.lg-body .lg-fa, .lg-body .lg-fa * { direction: rtl; text-align: right; }
.lg-body .lg-fa .lg-sw, .lg-body .lg-fa .lg-sw *, .lg-body .lg-fa b[dir="ltr"], .lg-body .lg-fa .lg-en { direction: ltr; unicode-bidi: isolate; }
.lg-body .lg-fa .lg-row p, .lg-body .lg-fa .lg-row p .fa { color: #d5d1c7; font-size: 14.5px; line-height: 1.75; }
.lg-body .lg-fa .lg-name .fa { color: var(--fg); font-size: 15px; font-weight: 600; }
.lg-body .lg-fa .lg-name b { color: var(--gold); font-size: 12.5px; }
.lg-body .lg-fa h3 .fa { color: var(--gold); font-size: 14px; font-weight: 600; }
.lg-en { color: var(--dim); font-size: 11px; }
.lg-guide { margin-top: 14px; padding: 8px 12px; border: 1px solid rgba(214,173,82,.35); border-radius: 8px; background: rgba(214,173,82,.06); }
.lg-guide h3 { margin-top: 4px; }
.lg-guide ol { margin: 4px 0 6px; padding-inline-start: 22px; }
.lg-guide li { margin: 3px 0; font-size: 13.5px; color: #d5d1c7; }
.lg-body .lg-fa .lg-guide li .fa { color: #d5d1c7; font-size: 14.5px; }
.lg-tag { display: inline-block; padding: 0 4px; border: 1px solid; border-radius: 3px; background: #0e0f11; font: 600 11px/15px var(--mono); white-space: nowrap; }
.lg-txt { font: 600 12px var(--mono); }
.lg-line { width: 46px; height: 0; }
.lg-band { width: 52px; height: 18px; background: rgba(214,173,82,.12); position: relative; border-radius: 2px; }
.lg-band i { position: absolute; left: 0; right: 0; top: 5px; bottom: 5px; background: rgba(214,173,82,.25); border-top: 2px dashed var(--gold); }
.lg-box { width: 46px; height: 16px; border: 1px solid var(--c); border-radius: 2px; background: color-mix(in srgb, var(--c) 18%, transparent); }
.lg-box.faint { opacity: .45; }
.lg-col { width: 26px; height: 20px; background: color-mix(in srgb, var(--c) 22%, transparent); border-bottom: 2px dashed var(--c); }
.lg-arrow { width: 0; height: 0; border: 7px solid transparent; }
.lg-arrow.up { border-bottom: 11px solid var(--c); border-top: 0; }
.lg-arrow.dn { border-top: 11px solid var(--c); border-bottom: 0; }

/* ---------------- 1. what to do now */
#todo { border-width: 1.5px; padding: 11px 14px 12px; }
#todo.k-now.up { border-color: var(--up); background: linear-gradient(rgba(47,182,124,.14), rgba(47,182,124,.04)); }
#todo.k-now.down { border-color: var(--down); background: linear-gradient(rgba(229,72,77,.14), rgba(229,72,77,.04)); }
#todo.k-ready.up { border-color: rgba(47,182,124,.7); border-style: dashed; }
#todo.k-ready.down { border-color: rgba(229,72,77,.7); border-style: dashed; }
#todo.k-dont { border-color: rgba(232,178,58,.65); background: rgba(232,178,58,.05); }
#todo.k-watch.up { border-color: rgba(47,182,124,.4); } #todo.k-watch.down { border-color: rgba(229,72,77,.4); }
.act { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; font: 700 32px/1.05 var(--label); letter-spacing: .03em; margin: 2px 0 4px; }
.act.up { color: var(--up); } .act.down { color: var(--down); } .act.dim { color: var(--dim); } .act.dont { color: var(--warn); }
.act.soft { opacity: .82; }
.grade { display: inline-block; padding: 1px 6px; border-radius: 5px; font: 700 12px/17px var(--mono); letter-spacing: 0; border: 1px solid var(--line); color: var(--dim); }
.grade.ap { background: var(--gold); border-color: var(--gold); color: #1a1405; }
.grade.a { color: var(--gold); border-color: rgba(214,173,82,.6); }
.grade.off { opacity: .5; }
.enter { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; margin: 2px 0 4px; font: 600 14px var(--label); color: var(--fg); }
.enter b { font: 700 19px var(--mono); letter-spacing: -.01em; }
.because { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0 6px; }
.chip { border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font: 600 12px/18px var(--label); letter-spacing: .02em; color: var(--dim); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.chip b { font: 600 11.5px var(--mono); color: var(--fg); }
.chip.on { color: var(--gold); border-color: rgba(214,173,82,.55); background: rgba(214,173,82,.08); }
.chip.up { color: var(--up); border-color: rgba(47,182,124,.5); } .chip.down { color: var(--down); border-color: rgba(229,72,77,.5); }
.chip.warn { color: #ffcf7a; border-color: rgba(232,178,58,.6); background: rgba(232,178,58,.08); }
.chip.bad { color: #ffb9b5; border-color: rgba(229,72,77,.6); background: rgba(229,72,77,.1); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
.newswait { margin: 6px 0; border: 1px solid rgba(229,72,77,.55); background: rgba(229,72,77,.1); color: #ffc9c4; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
.newswait b { color: #fff; }
.cks { display: grid; gap: 2px; font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 6px; }
.cks > b { font: 700 11px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
.ck { display: grid; grid-template-columns: 14px 62px minmax(0, 1fr); gap: 6px; color: #d9d5cb; align-items: baseline; }
.ck i { font-style: normal; font-weight: 700; text-align: center; }
.ck i.ok { color: var(--up); } .ck i.no { color: var(--down); } .ck i.na { color: var(--dim); }
.ck em { font: 600 10.5px var(--label); font-style: normal; letter-spacing: .06em; text-transform: uppercase; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ck.na span { color: var(--dim); }
ul.why2 { margin: 4px 0 0; padding-left: 16px; font-size: 12.5px; color: #d9d5cb; display: grid; gap: 1px; }
.foot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 8px; font-size: 12px; color: var(--dim); }

/* your MT5 positions (read-only) */
#todo .bh .r { overflow: visible; white-space: normal; }
#todo .mine { margin: 6px 0 2px; padding: 6px 10px; border-left: 3px solid var(--buy); border-radius: 0 8px 8px 0; background: rgba(47,123,245,.08); font-size: 13px; line-height: 1.45; color: #dcd8ce; }
#todo .mine.s { border-left-color: var(--sell); background: rgba(229,83,60,.08); }
#todo .mine b { color: var(--fg); }
.b { color: var(--buy); } .s { color: var(--sell); }
#posBox.empty { padding-top: 7px; padding-bottom: 7px; }
#posBox.empty .bh { margin-bottom: 0; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; padding: 6px 0; border-top: 1px solid rgba(38,42,47,.75); align-items: baseline; }
.prow:first-of-type { border-top: 0; }
.prow .l1 { font: 600 13px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .l1 .sd2 { font: 700 13px var(--label); letter-spacing: .06em; margin-right: 6px; }
.prow .pl { font: 700 14px var(--mono); text-align: right; white-space: nowrap; }
.prow .l2 { grid-column: 1 / -1; font: 500 11.5px var(--mono); color: var(--dim); display: flex; flex-wrap: wrap; gap: 0 10px; }
.ptot { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; border-top: 1px solid var(--line); padding-top: 6px; margin-top: 2px; font-size: 12.5px; color: var(--dim); }
.ptot b { font: 700 14px var(--mono); color: var(--fg); }

/* forming now: models building on the live candles (state.ict.forming) */
.fbest { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 6px; }
.fbest.up { border-color: rgba(47,182,124,.55); background: rgba(47,182,124,.05); }
.fbest.down { border-color: rgba(229,72,77,.55); background: rgba(229,72,77,.05); }
.fbest .fh { font: 700 10.5px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
.fbest .fn { display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; font: 600 13.5px var(--label); color: var(--dim); }
.fbest .fn b.nm { font: 700 17px var(--label); letter-spacing: .02em; color: var(--fg); }
.fbest .fn .cfb { font: 700 15px var(--mono); color: var(--fg); margin-left: auto; }
.pbar { height: 5px; border-radius: 3px; background: var(--raise); overflow: hidden; margin: 5px 0; }
.pbar i { display: block; height: 100%; background: var(--gold); }
.steps { display: grid; gap: 1px; font-size: 12.5px; }
.st2 { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 6px; color: #d9d5cb; }
.st2 i { font-style: normal; font-weight: 700; text-align: center; }
.st2 i.ok { color: var(--up); } .st2 i.no { color: var(--down); } .st2 i.na { color: var(--dim); }
.st2.todo span { color: var(--dim); }
.nextc { font-size: 13px; color: var(--fg); margin-top: 5px; line-height: 1.4; }
.nextc b { color: var(--gold); font: 700 10.5px var(--label); letter-spacing: .1em; text-transform: uppercase; margin-right: 4px; }
.stg { font: 700 9.5px var(--label); letter-spacing: .08em; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--dim); text-transform: uppercase; text-align: center; white-space: nowrap; }
.stg.s-forming { color: var(--warn); border-color: rgba(232,178,58,.5); }
.stg.s-set { color: var(--gold); border-color: rgba(214,173,82,.55); }
.stg.s-ready { color: #0e0f11; background: var(--gold); border-color: var(--gold); }
.stg.s-enter { color: #0e0f11; background: var(--up); border-color: var(--up); }
.fr { display: grid; grid-template-columns: 78px 40px 34px minmax(0, 1fr); gap: 2px 8px; align-items: center; padding: 5px 2px; border-top: 1px solid rgba(38,42,47,.75); font-size: 12.5px; cursor: pointer; }
.fr:hover { background: rgba(28,31,35,.6); }
.fr .pb { height: 4px; background: var(--raise); border-radius: 2px; overflow: hidden; }
.fr .pb i { display: block; height: 100%; background: var(--gold); }
.fr .cf { font: 600 11.5px var(--mono); text-align: right; }
.fr .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fr .nx { grid-column: 1 / -1; display: none; font-size: 12px; color: #cfcbc1; padding: 2px 0 2px; }
.fr.open .nx { display: block; }
.fr.w { opacity: .55; }
.mb { font: 600 9.5px var(--mono); color: var(--gold); border: 1px solid rgba(214,173,82,.45); border-radius: 4px; padding: 0 3px; margin-left: 4px; vertical-align: 1px; }
.pushl { display: grid; gap: 4px; margin-top: 2px; }
.pushl > div { font-size: 12px; border-top: 1px solid rgba(38,42,47,.75); padding-top: 4px; }
.pushl b { font-size: 12.5px; color: var(--fg); }
.pushl p { margin: 1px 0 0; white-space: pre-line; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------------- 2. overall analysis */
.verdict { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; }
.verdict b { font: 700 24px var(--label); letter-spacing: .05em; }
.verdict .sc { font: 700 15px var(--mono); }
.verdict .cf { margin-left: auto; font: 500 12px var(--mono); color: var(--dim); }
.sbar { position: relative; height: 10px; border-radius: 5px; margin: 7px 0 2px; background: linear-gradient(90deg, rgba(229,72,77,.45), rgba(142,138,128,.18) 50%, rgba(47,182,124,.45)); }
.sbar::after { content: ""; position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: var(--dim); }
.sbar i { position: absolute; top: -4px; width: 4px; height: 18px; margin-left: -2px; border-radius: 2px; background: var(--fg); box-shadow: 0 0 0 2px var(--bg); }
.sax { display: flex; justify-content: space-between; font: 500 10.5px var(--mono); color: var(--dim); }
.dobox { margin: 8px 0 4px; font: 600 13px var(--label); color: var(--dim); letter-spacing: .02em; }
.dobox b { color: var(--fg); font-size: 14px; letter-spacing: .04em; }
.voices { display: grid; gap: 0; margin-top: 4px; }
.vo { display: grid; grid-template-columns: minmax(0, 1fr) 76px 40px; gap: 0 8px; align-items: center; padding: 4px 0; border-top: 1px solid rgba(38,42,47,.75); }
.vo .vn { font-size: 12.5px; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vo .vn small { color: var(--dim); font: 500 10.5px var(--mono); margin-left: 4px; }
.vo .vb { height: 6px; background: var(--raise); border-radius: 3px; position: relative; }
.vo .vb::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--dim); opacity: .6; }
.vo .vb i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.vo .vv { font: 700 11.5px var(--mono); text-align: right; }
.vo .vt { grid-column: 1 / -1; font-size: 11.5px; color: var(--dim); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.vo.off .vn, .vo.off .vv { color: var(--dim); }
.vo.off .vb { opacity: .35; }
.vo.against .vn::after { content: " · against"; color: var(--warn); font-size: 11px; }
.otext { margin-top: 8px; font-size: 12.5px; line-height: 1.5; color: #cfcbc1; }

/* ---------------- forecast voices (Kronos + quant) and the line's blend */
.mrow { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 2px 10px; padding: 6px 0; border-top: 1px solid rgba(38,42,47,.75); align-items: baseline; }
.mrow:first-of-type { border-top: 0; }
.mrow > b { font: 700 11.5px var(--label); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.mrow .call { font: 700 15px var(--label); letter-spacing: .03em; }
.mrow .call .num { font-size: 12.5px; font-weight: 600; color: var(--fg); margin-left: 6px; }
.mrow .sk { grid-column: 2; font-size: 12px; color: var(--dim); line-height: 1.4; }
.mrow .sk b.ok { color: var(--up); } .mrow .sk b.no { color: var(--warn); }
.qs { grid-column: 1 / -1; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 0 10px; font-size: 12px; padding: 2px 0; }
.qs > span:first-child { font: 600 11px var(--label); letter-spacing: .04em; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qs .c { font: 700 12px var(--mono); margin-right: 6px; }
.qs .x { color: var(--dim); }
.qs .st { display: block; color: var(--dim); font-size: 11.5px; }
.qs.off { opacity: .55; }

/* ---------------- ICT read, best model, timeframes */
.ibias { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); margin: 6px 0 2px; }
.ibias .bar { height: 6px; background: var(--raise); border-radius: 3px; position: relative; }
.ibias .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.ibias .bar::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--dim); opacity: .5; }
.ibias .why { grid-column: 1 / -1; margin-top: -3px; }
.phases { display: grid; gap: 8px; margin: 6px 0 2px; padding-top: 7px; border-top: 1px solid var(--line); }
.ph { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 0 8px; font-size: 13px; line-height: 1.45; color: #d9d5cb; }
.ph i { font: 700 11px var(--mono); font-style: normal; color: var(--bg); background: var(--gold); border-radius: 50%; width: 18px; height: 18px; display: grid; place-items: center; margin-top: 1px; }
.ph i.x { background: var(--dim); }
.ph b { display: block; font: 700 10.5px var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.mname { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font: 700 19px var(--label); letter-spacing: .02em; }
.sd { display: flex; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; font: 700 14px var(--label); letter-spacing: .05em; margin: 4px 0 2px; }
.sd.up { color: var(--up); } .sd.down { color: var(--down); }
.stat { font: 700 10.5px var(--label); letter-spacing: .1em; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
.stat.armed { color: var(--gold); border-color: rgba(214,173,82,.6); } .stat.filled { color: var(--up); border-color: rgba(47,182,124,.6); }
.stat.target { color: var(--up); } .stat.stopped, .stat.invalid { color: var(--down); }
.trig { margin: 4px 0; padding: 6px 9px; border-radius: 8px; background: var(--raise); font-size: 12.5px; color: #d9d5cb; }
.trig b { color: var(--fg); }
.rank { display: grid; border-top: 1px solid var(--line); margin-top: 6px; }
.rank > b { font: 700 11px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 6px 0 3px; }
.rk { display: grid; grid-template-columns: 16px minmax(0, 1fr) 34px 70px 30px; gap: 2px 6px; align-items: center; padding: 5px 2px; border-top: 1px solid rgba(38,42,47,.7); font-size: 12.5px; cursor: pointer; border-radius: 5px; }
.rk:hover { background: rgba(28,31,35,.7); }
.rk.top { background: rgba(214,173,82,.06); }
.rk .n { font: 600 11px var(--mono); color: var(--dim); }
.rk .nm { min-width: 0; display: grid; gap: 3px; }
.rk .nm span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rk .sb { height: 3px; border-radius: 2px; background: var(--raise); overflow: hidden; }
.rk .sb i { display: block; height: 100%; background: var(--gold); }
.rk .f, .rk .rc { font: 600 11px var(--mono); color: var(--dim); text-align: right; white-space: nowrap; }
.rk .rc.up { color: var(--up); } .rk .rc.down { color: var(--down); }
.rk .g { text-align: right; color: var(--dim); }
.rk .more { grid-column: 2 / -1; font-size: 12px; color: var(--dim); display: grid; gap: 2px; padding: 2px 0 3px; }
.rk .more .v { color: var(--fg); }
.rkhead { display: grid; grid-template-columns: 16px minmax(0, 1fr) 34px 70px 30px; gap: 6px; padding: 0 2px 2px; font: 600 10px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.rkhead span:nth-child(n+3) { text-align: right; }
.rkall { justify-self: start; margin-top: 4px; font: 600 12px var(--label); color: var(--dim); padding: 3px 0; }
.rkall:hover { color: var(--gold); }
.tr { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 2px 8px; padding: 6px 6px; border-top: 1px solid var(--line); align-items: baseline; border-radius: 6px; }
.tr[data-tf] { cursor: pointer; } .tr[data-tf]:hover { background: rgba(28,31,35,.7); }
.tr.here { background: var(--raise); }
.tr .tf { font: 700 12.5px var(--mono); color: var(--fg); }
.tr .role { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tr .rd { font: 700 12px var(--label); letter-spacing: .06em; text-align: right; white-space: nowrap; }
.tr .rd.up { color: var(--up); } .tr .rd.down { color: var(--down); } .tr .rd.flat { color: var(--dim); }
.tr .ln { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 2px 8px; font: 500 11.5px var(--mono); color: var(--dim); }
.tr .ln .up { color: var(--up); } .tr .ln .down { color: var(--down); }
.tr .do { grid-column: 2 / -1; font-size: 12.5px; line-height: 1.4; color: var(--fg); }
.tr .ph2 { grid-column: 2 / -1; font-size: 11.5px; line-height: 1.35; color: var(--dim); }
.tr .smt { grid-column: 2 / -1; font-size: 11.5px; color: var(--gold); }
.zp { font: 700 10px/15px var(--label); letter-spacing: .08em; padding: 0 5px; border-radius: 4px; background: var(--raise); color: var(--dim); }
.zp.premium { color: #ff9f97; background: rgba(229,72,77,.12); } .zp.discount { color: #7fdcb0; background: rgba(47,182,124,.12); }

/* ---------------- candle by candle */
.newest { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
.rd { border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; min-width: 0; }
.rd.bullish { border-color: rgba(47,182,124,.45); } .rd.bearish { border-color: rgba(229,72,77,.45); }
.rd .rh { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font: 600 12px var(--mono); }
.rd .rh .tn { font: 700 11px var(--label); letter-spacing: .08em; text-transform: uppercase; }
.rd .rh .pt { font: 600 11.5px var(--label); color: var(--gold); }
.rd ul { margin: 3px 0 0; padding-left: 14px; font-size: 12px; line-height: 1.35; color: #d3cfc5; }
.ev.up::marker { color: var(--up); } .ev.down::marker { color: var(--down); }
.hist { display: grid; }
.hr { display: grid; grid-template-columns: 40px 10px minmax(0, 1fr) auto; gap: 0 7px; align-items: start; padding: 4px 2px; border-top: 1px solid rgba(38,42,47,.75); font-size: 12px; cursor: pointer; }
.hr:hover { background: rgba(28,31,35,.6); }
.hr time { font: 600 11.5px var(--mono); color: var(--dim); padding-top: 1px; }
.hr .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); margin-top: 5px; }
.hr .dot.bullish { background: var(--up); } .hr .dot.bearish { background: var(--down); }
.hr .evs { color: #cfcbc1; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hr.open .evs { -webkit-line-clamp: unset; display: block; }
.hr .evs em { font-style: normal; color: var(--gold); }
.hr .ac { font: 700 10.5px var(--label); letter-spacing: .06em; color: var(--dim); white-space: nowrap; padding-top: 1px; }
.hr .ac.up { color: var(--up); } .hr .ac.down { color: var(--down); }
.hr .ac.ent { color: #0e0f11; background: var(--up); border-radius: 4px; padding: 0 5px; }
.hr .ac.ent.down { background: var(--down); }
.hr.ent { background: rgba(214,173,82,.07); }

/* ---------------- news */
.nx { border: 1px solid var(--line); border-radius: 9px; padding: 6px 9px; margin-bottom: 6px; }
.nx .t { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; font-size: 13px; }
.nx .t b { font-weight: 700; }
.nx .cd { margin-left: auto; font: 700 14px var(--mono); color: var(--warn); }
.nx .ge { font-size: 12px; color: #d3cfc5; margin-top: 2px; }
.imp { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--dim); }
.imp.high { background: var(--down); } .imp.medium { background: var(--warn); } .imp.low { background: #6f6a60; }
.hl { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 0 6px; padding: 4px 0; border-top: 1px solid rgba(38,42,47,.75); font-size: 12.5px; cursor: pointer; }
.hl .ar { font-weight: 700; text-align: center; }
.hl .tt { color: var(--fg); line-height: 1.35; }
.hl .src { display: block; font: 500 11px var(--mono); color: var(--dim); }
.hl .why { display: none; font-size: 12px; color: #cfcbc1; margin-top: 2px; }
.hl.open .why { display: block; }
.hl a { color: var(--dim); text-decoration: none; margin-left: 4px; }
.hl a:hover { color: var(--gold); }
.nbias { display: flex; align-items: baseline; gap: 8px; margin: 4px 0; font-size: 12.5px; }
.ev2 { display: grid; grid-template-columns: 46px 10px minmax(0, 1fr) auto; gap: 0 6px; align-items: baseline; padding: 3px 0; border-top: 1px solid rgba(38,42,47,.7); font-size: 12px; }
.ev2 time { font: 600 11px var(--mono); color: var(--dim); }

/* ---------------- day map */
.strip { position: relative; height: 30px; border-radius: 7px; overflow: hidden; background: var(--raise); margin-top: 2px; }
.seg { position: absolute; top: 0; bottom: 0; border-right: 1px solid var(--bg); background: rgba(142,138,128,.16); color: var(--dim); font: 600 10.5px var(--label); letter-spacing: .02em; display: flex; align-items: center; justify-content: center; overflow: hidden; white-space: nowrap; padding: 0 2px; }
.seg span { overflow: hidden; text-overflow: clip; }
.seg:hover, .seg.sel { background: rgba(214,173,82,.22); color: var(--fg); }
.seg.sb { background: rgba(214,173,82,.2); color: #e9d39a; }
.seg.kz { background: rgba(47,123,245,.16); color: #a9c4f5; }
.seg.avoid { background: repeating-linear-gradient(135deg, rgba(142,138,128,.18) 0 4px, rgba(14,15,17,.6) 4px 8px); color: #6f6a60; }
.seg.now { box-shadow: inset 0 0 0 2px var(--gold); color: var(--fg); }
.nowmk { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--fg); z-index: 2; pointer-events: none; border-radius: 1px; }
.ticks { position: relative; height: 14px; font: 500 10px var(--mono); color: var(--dim); }
.ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ticks span:first-child { transform: none; }
.dmd { display: grid; gap: 2px; font-size: 12.5px; margin-top: 2px; }
.dmd .nm { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 8px; }
.dmd .nm b { font: 700 13.5px var(--label); letter-spacing: .03em; }
.dmd .nm .num { font-size: 11.5px; color: var(--dim); }
.dmd .note { color: #cfcbc1; }
.dmd .fits { display: flex; flex-wrap: wrap; gap: 3px 6px; align-items: baseline; }
.dmd .fits > em { font: 700 10.5px var(--label); font-style: normal; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.allw { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 4px; }
.aw { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 0 10px; padding: 5px 0; border-top: 1px solid rgba(38,42,47,.75); font-size: 12.5px; cursor: pointer; }
.aw:first-of-type { border-top: 0; }
.aw .tm { font: 600 11.5px var(--mono); color: var(--dim); }
.aw .tm small { display: block; font-size: 10.5px; }
.aw b { font: 700 13px var(--label); }
.aw.now { background: rgba(214,173,82,.07); border-radius: 6px; }
.aw.avoid b { color: var(--dim); }
.dmbtn { white-space: nowrap; flex: none; font: 600 12px var(--label); color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 1px 8px; }
.dmbtn:hover, .dmbtn.on { color: var(--gold); border-color: rgba(214,173,82,.5); }

/* ---------------- more: Kronos card and the live scoreboard */
.kv { display: inline-flex; gap: 2px; background: var(--raise); border-radius: 7px; padding: 2px; }
.kv button { padding: 2px 8px; border-radius: 5px; font: 600 12px var(--label); color: var(--dim); }
.kv button.on { background: var(--panel); color: var(--fg); }
.odds { display: flex; gap: 14px; font-size: 13px; color: var(--dim); margin-top: 2px; }
.odds b { font: 700 14px var(--mono); color: var(--fg); }
.odds b.up { color: var(--up); } .odds b.down { color: var(--down); }
.split { height: 5px; border-radius: 3px; background: var(--down); overflow: hidden; margin: 3px 0; }
.split i { display: block; height: 100%; background: var(--up); }
.mini { width: 100%; height: 92px; display: block; background: var(--panel); border-radius: 6px; margin: 2px 0; }
.mlegend { display: flex; gap: 12px; font-size: 11px; }
.mlegend span { display: inline-flex; align-items: center; gap: 5px; }
.mlegend i { width: 14px; height: 0; border-top: 2px solid var(--fg); }
.mlegend i.f { border-top: 2px dashed var(--gold); }
.mlegend i.s { height: 8px; border: 0; background: rgba(214,173,82,.3); border-radius: 2px; }
.bt { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; font-size: 12px; color: var(--dim); display: grid; gap: 2px; }
.bt b { font: 600 11px var(--label); letter-spacing: .1em; text-transform: uppercase; }
.bt .v { color: var(--fg); }
.kcall { font: 700 18px var(--label); letter-spacing: .04em; }
.mesh table { width: 100%; border-collapse: collapse; font-size: 12px; }
.mesh th { text-align: right; padding: 2px 0 4px 8px; font: 600 10.5px var(--label); letter-spacing: .08em; color: var(--dim); }
.mesh th:first-child, .mesh td:first-child { text-align: left; padding-left: 0; }
.mesh td { text-align: right; padding: 3px 0 3px 8px; border-top: 1px solid var(--line); font-family: var(--mono); color: var(--dim); white-space: nowrap; }
.mesh td:first-child { font-family: var(--ui); color: var(--fg); white-space: normal; }
.mesh td.up { color: var(--up); } .mesh td.down { color: var(--down); }
.mesh td small { color: var(--dim); opacity: .7; margin-left: 3px; font-size: 10px; }
.mesh td.base:first-child { color: var(--dim); }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 1180px) and (min-width: 901px) {
  main { grid-template-columns: minmax(0, 1fr) 360px; }
  .dock { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}
@media (max-width: 900px) {
  html { height: auto; }
  body { overflow: auto; height: auto; }
  header { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 6px 10px; }
  .quote { margin-left: auto; }
  .quote b#bid { font-size: 18px; }
  main { display: flex; flex-direction: column; padding-bottom: 20px; }
  aside, .dock { display: contents; }
  main .box { margin: 12px 16px 0; }
  #todo { order: 1; }
  .chartwrap { order: 2; height: 56vh; min-height: 320px; margin-top: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #overall { order: 3; } #formBox { order: 4; } #posBox { order: 5; } #newsBox { order: 6; } #feed { order: 7; } #ictTf { order: 8; } #more { order: 9; }
  #feed, #newsBox { overflow: visible; }
  .hist { max-height: 360px; overflow: auto; }
  .chartbar { left: 8px; right: 50px; gap: 4px; }
  .tfs button, .ovl button { padding: 3px 7px; font-size: 12px; gap: 4px; }
  .reads { left: 8px; max-width: calc(100% - 70px); }
  .legend { position: fixed; inset: 10px; width: auto; max-width: none; max-height: none; z-index: 50; }
  .act { font-size: 29px; }
  header .pill.ao, header #pushPill { font-size: 10px; padding: 3px 8px; }
  .newest { grid-template-columns: 1fr; }
  .seg.small span { display: none; }
  .ovl .xl, #smcRead { display: none !important; }
  .helpbtn { height: 28px; width: 28px; }
}
