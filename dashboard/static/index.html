<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dash-token" content="__DASH_TOKEN__">
<title>Gold Desk</title>
<style>
:root {
  --bg: #0d1014;
  --panel: #141920;
  --line: #242c36;
  --fg: #e6eaef;
  --dim: #8792a1;
  --buy: #2f7df6;
  --sell: #e8553a;
  --good: #34b37e;
  --bad: #e5484d;
  --warn: #e5b33b;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--sans); display: flex; flex-direction: column; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; width: 100%; }
input:focus { outline: 2px solid #3a4a5e; outline-offset: -1px; }

/* top bar */
header { display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: .04em; }
.brand span { color: var(--dim); font-weight: 500; margin-left: 6px; }
.badge { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; letter-spacing: .04em; }
.badge.demo { background: rgba(52,179,126,.16); color: var(--good); }
.badge.real { background: rgba(229,72,77,.18); color: var(--bad); }
.live { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.dot.on { background: var(--good); box-shadow: 0 0 0 3px rgba(52,179,126,.18); }
.money { margin-left: auto; display: flex; gap: 18px; font-size: 13px; color: var(--dim); }
.money b { color: var(--fg); font-weight: 600; margin-left: 6px; }

/* main */
main { flex: 1; min-height: 0; display: flex; }
.chartwrap { flex: 1; min-width: 0; position: relative; }
#chart { position: absolute; inset: 0; }
.tfs { position: absolute; top: 10px; left: 10px; z-index: 3; display: flex; gap: 4px; background: rgba(20,25,32,.9); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
.tfs button { background: none; padding: 4px 10px; border-radius: 6px; color: var(--dim); font-size: 13px; }
.tfs button.on { background: #263040; color: var(--fg); }

aside { width: 340px; flex: none; border-left: 1px solid var(--line); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: auto; }

/* buy / sell */
.trade { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; position: relative; }
.big { border-radius: 12px; padding: 14px 8px 12px; text-align: center; color: #fff; transition: transform .06s, filter .1s; user-select: none; }
.big:active { transform: scale(.97); }
.big:disabled { filter: grayscale(.7) brightness(.7); cursor: default; }
.big small { display: block; font-size: 13px; font-weight: 700; letter-spacing: .1em; opacity: .9; }
.big .px { display: block; font: 700 24px var(--mono); margin-top: 2px; }
.sell { background: var(--sell); }
.buy { background: var(--buy); }
.big.flash { filter: brightness(1.35); }
.spread { position: absolute; left: 50%; top: -9px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-size: 11px; color: var(--dim); }

.label { font-size: 12px; color: var(--dim); margin-bottom: 6px; }
.lots { display: grid; grid-template-columns: 44px 1fr 44px; gap: 8px; }
.lots button { background: #222a35; border-radius: 8px; font-size: 20px; }
.lots input { text-align: center; font: 700 20px var(--mono); }
.chips { display: flex; gap: 6px; margin-top: 8px; }
.chips button { flex: 1; background: #1c232d; border: 1px solid var(--line); border-radius: 8px; padding: 6px 0; font: 12px var(--mono); color: var(--dim); }
.chips button.on { border-color: var(--fg); color: var(--fg); }
.sltp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* result line */
.status { border-radius: 10px; padding: 12px; background: #10151b; border: 1px solid var(--line); min-height: 64px; }
.status .what { font-weight: 600; font-size: 15px; }
.status .sub { color: var(--dim); font-size: 12px; margin-top: 3px; }
.status.ok { border-color: rgba(52,179,126,.5); }
.status.ok .what { color: var(--good); }
.status.bad { border-color: rgba(229,72,77,.6); }
.status.bad .what { color: var(--bad); }
.status.wait .what { color: var(--warn); }

.closeall { background: none; border: 1.5px solid var(--bad); color: var(--bad); border-radius: 10px; padding: 11px; font-weight: 700; letter-spacing: .04em; }
.closeall:disabled { border-color: var(--line); color: var(--dim); cursor: default; }

.pos { display: flex; flex-direction: column; gap: 6px; }
.prow { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; background: #10151b; border-radius: 8px; padding: 7px 8px; font-size: 13px; }
.prow.raw { display: block; font: 12px var(--mono); color: var(--fg); }
.prow .x { background: #2a1d1f; color: var(--bad); border-radius: 6px; padding: 3px 9px; font-weight: 600; }
.tag { font-weight: 700; font-size: 12px; }
.tag.b { color: var(--buy); } .tag.s { color: var(--sell); }
.good { color: var(--good); } .bad { color: var(--bad); } .dim { color: var(--dim); }

.signal { font-size: 13px; border-top: 1px solid var(--line); padding-top: 12px; }
.signal .use { background: #222a35; border-radius: 6px; padding: 3px 9px; font-size: 12px; margin-left: 6px; }

.banner { background: rgba(229,72,77,.14); color: #ffb3b5; padding: 8px 16px; font-size: 13px; border-bottom: 1px solid var(--line); }

@media (max-width: 820px) {
  main { flex-direction: column; }
  .chartwrap { min-height: 52vh; }
  aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
  .money { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<header>
  <div class="brand">GOLD DESK<span>XAUUSD</span></div>
  <span class="badge real" id="badge">…</span>
  <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">Connecting</span></div>
  <div class="money"><span>Balance<b class="num" id="bal">-</b></span><span>Equity<b class="num" id="eq">-</b></span></div>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <div class="chartwrap">
    <div class="tfs" id="tfs"><button data-tf="M1" class="on">1m</button><button data-tf="M5">5m</button><button data-tf="M15">15m</button><button data-tf="H1">1h</button></div>
    <div id="chart"></div>
  </div>
  <aside>
    <div class="trade">
      <button class="big sell" id="sell"><small>SELL</small><span class="px" id="bid">-</span></button>
      <button class="big buy" id="buy"><small>BUY</small><span class="px" id="ask">-</span></button>
      <span class="spread num" id="spr">-</span>
    </div>

    <div>
      <div class="label">Lots</div>
      <div class="lots"><button id="lotDown" aria-label="Fewer lots">−</button><input id="lots" class="num" inputmode="decimal" value="0.01"><button id="lotUp" aria-label="More lots">+</button></div>
      <div class="chips" id="chips"><button>0.01</button><button>0.05</button><button>0.10</button><button>0.50</button><button>1.00</button></div>
    </div>

    <div>
      <div class="label">Stop loss / Take profit (optional, price)</div>
      <div class="sltp"><input id="sl" class="num" inputmode="decimal" placeholder="SL none"><input id="tp" class="num" inputmode="decimal" placeholder="TP none"></div>
    </div>

    <div class="status" id="status"><div class="what">Ready</div><div class="sub">Click BUY or SELL. Orders go out instantly, no confirm box.</div></div>

    <button class="closeall" id="closeAll">CLOSE ALL</button>
    <div class="pos" id="pos"></div>

    <div class="signal" id="signal"></div>
  </aside>
</main>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>
