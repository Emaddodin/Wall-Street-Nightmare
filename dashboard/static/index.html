<!doctype html>
<html lang="en" dir="ltr" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="dash-token" content="__DASH_TOKEN__">
<title>Gold Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: one screen. Chart left with the open-trades blotter under it; the order rail on the right reads top to bottom:
   price + one-click buttons, lots, what just happened, signals. */
:root {
  --bg: #0e0f11;          /* graphite, faintly warm */
  --panel: #15171a;
  --raise: #1c1f23;
  --line: #262a2f;
  --fg: #ece8df;
  --dim: #8e8a80;
  --gold: #d6ad52;        /* brand only */
  --buy: #2f7bf5;
  --sell: #e5533c;
  --up: #2fb67c;
  --down: #e5484d;
  --warn: #e8b23a;
  --ui: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --label: "Barlow Semi Condensed", "Barlow", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; direction: ltr !important; unicode-bidi: isolate; }
body * { direction: ltr; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--ui); display: flex; flex-direction: column; overflow: hidden; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.up { color: var(--up); } .down { color: var(--down); } .dim { color: var(--dim); }
.eyebrow { font: 600 11px var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }

/* ---------------- top bar */
header { display: flex; align-items: center; gap: 22px; padding: 0 18px; height: 56px; border-bottom: 1px solid var(--line); background: var(--panel); flex: none; }
.brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.brand b { font: 700 16px var(--label); letter-spacing: .14em; color: var(--gold); }
.brand span { font: 500 13px var(--mono); color: var(--dim); }
.pill { font: 700 11px var(--label); letter-spacing: .12em; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.demo { background: rgba(47,182,124,.14); color: var(--up); }
.pill.real { background: var(--down); color: #fff; }
.pill.unknown { background: rgba(232,178,58,.15); color: var(--warn); }
.conn { display: flex; align-items: center; gap: 7px; font: 500 13px var(--label); color: var(--dim); white-space: nowrap; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--down); }
.conn.on i { background: var(--up); animation: beat 1.6s ease-out infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 rgba(47,182,124,.5); } 100% { box-shadow: 0 0 0 7px rgba(47,182,124,0); } }
.kpis { margin-left: auto; display: flex; gap: 26px; }
.kpi { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.kpi b { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; }
.kpi.pl b { font-size: 17px; }

.banner { background: rgba(229,72,77,.12); color: #ffb9b5; padding: 8px 18px; font-size: 14px; border-bottom: 1px solid rgba(229,72,77,.35); flex: none; }

/* ---------------- main grid */
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 372px; }
.left { min-width: 0; min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.chartwrap { position: relative; min-height: 0; }
#chart { position: absolute; inset: 0; }
.chartbar { position: absolute; top: 12px; left: 12px; z-index: 3; display: flex; gap: 8px; flex-wrap: wrap; }
#zones { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; pointer-events: none; }
.ovl { display: flex; gap: 2px; background: rgba(21,23,26,.92); padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.ovl button { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border-radius: 6px; color: var(--dim); font: 600 13px var(--label); }
.ovl button.on { background: var(--raise); color: var(--fg); }
.ovl button i { width: 14px; height: 0; border-top: 2px dashed var(--gold); }
.ovl button i.z { height: 10px; border: 1px solid rgba(47,123,245,.8); background: rgba(47,123,245,.25); border-radius: 2px; }
.ovl button i.b { width: 0; height: 0; border: 5px solid transparent; border-bottom: 9px solid var(--up); border-top: 0; }
.ovl button:not(.on) i { opacity: .35; }
.tfs { display: flex; gap: 2px; background: rgba(21,23,26,.92); padding: 3px; border-radius: 9px; border: 1px solid var(--line); }
.tfs button { padding: 4px 11px; border-radius: 6px; color: var(--dim); font: 600 13px var(--label); }
.tfs button.on { background: var(--raise); color: var(--fg); }

/* ---------------- blotter (open trades) */
.blotter { border-top: 1px solid var(--line); background: var(--panel); max-height: 34vh; display: flex; flex-direction: column; min-height: 0; }
.bhead { display: flex; align-items: center; gap: 14px; padding: 10px 16px; }
.bhead .eyebrow b { color: var(--fg); }
.bhead .total { font: 600 15px var(--mono); }
.closeall { margin-left: auto; border: 1.5px solid var(--down); color: var(--down); border-radius: 8px; padding: 6px 14px; font: 700 13px var(--label); letter-spacing: .08em; }
.closeall:hover:not(:disabled) { background: var(--down); color: #fff; }
.closeall:disabled { border-color: var(--line); color: var(--dim); cursor: default; }
.btable { overflow: auto; min-height: 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: right; font: 600 11px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); padding: 4px 16px; position: sticky; top: 0; background: var(--panel); }
td { text-align: right; padding: 7px 16px; border-top: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.side { font: 700 14px var(--label); letter-spacing: .06em; }
td.side.b { color: var(--buy); } td.side.s { color: var(--sell); }
td.pl { font-weight: 700; }
.x { color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; font: 600 12px var(--label); letter-spacing: .06em; }
.x:hover { color: #fff; background: var(--down); border-color: var(--down); }
.empty { padding: 4px 16px 14px; color: var(--dim); font-size: 14px; }
.raw { padding: 6px 16px; border-top: 1px solid var(--line); font: 13px var(--mono); }

/* ---------------- order rail */
aside { border-left: 1px solid var(--line); background: var(--panel); padding: 16px; display: flex; flex-direction: column; gap: 16px; overflow: auto; min-height: 0; }

.ticket { display: grid; grid-template-columns: 1fr 104px 1fr; gap: 6px; align-items: stretch; }
.big { border-radius: 12px; padding: 12px 6px 10px; text-align: center; color: #fff; user-select: none; position: relative; overflow: hidden; transition: transform .06s, filter .12s; }
.big:hover:not(:disabled) { filter: brightness(1.08); }
.big:active:not(:disabled) { transform: scale(.97); }
.big:disabled { filter: grayscale(.8) brightness(.6); cursor: default; }
.big small { display: block; font: 700 13px var(--label); letter-spacing: .16em; opacity: .92; }
.big .px { display: block; font: 700 21px var(--mono); font-variant-numeric: tabular-nums; margin-top: 3px; letter-spacing: -.02em; }
.big .px em { font-style: normal; font-size: 27px; }
.sell { background: var(--sell); }
.buy { background: var(--buy); }
.big.sending::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.28), transparent); animation: sweep .6s linear infinite; }
@keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.lotbox { display: grid; grid-template-rows: auto 1fr auto; gap: 4px; }
.lotbox button { background: var(--raise); border-radius: 7px; font: 600 16px var(--mono); color: var(--dim); height: 24px; }
.lotbox button:hover { color: var(--fg); }
.lotbox input { text-align: center; font: 700 19px var(--mono); padding: 4px 2px; border-radius: 7px; }
.spreadline { display: flex; justify-content: space-between; font: 500 13px var(--label); color: var(--dim); margin-top: -8px; }
.spreadline b { font: 600 13px var(--mono); color: var(--fg); }

.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.chips button { border: 1px solid var(--line); border-radius: 7px; padding: 5px 0; font: 500 13px var(--mono); color: var(--dim); }
.chips button:hover { color: var(--fg); }
.chips button.on { border-color: var(--gold); color: var(--gold); }

.protect summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font: 600 13px var(--label); letter-spacing: .04em; color: var(--dim); }
.protect summary::-webkit-details-marker { display: none; }
.protect summary::after { content: "+"; font: 600 16px var(--mono); }
.protect[open] summary::after { content: "−"; }
.protect summary .set { color: var(--fg); font: 500 12px var(--mono); margin-left: auto; margin-right: 10px; }
.sltp { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.sltp label { display: flex; flex-direction: column; gap: 4px; font: 600 11px var(--label); letter-spacing: .1em; color: var(--dim); }

/* what just happened */
.result { border-radius: 12px; padding: 12px 14px; background: var(--bg); border: 1px solid var(--line); display: grid; grid-template-columns: 26px 1fr; gap: 2px 10px; align-items: start; }
.result .ico { grid-row: span 2; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 700 14px var(--mono); background: var(--raise); color: var(--dim); }
.result .what { font-weight: 600; font-size: 16px; }
.result .sub { color: var(--dim); font-size: 13px; }
.result.ok { border-color: rgba(47,182,124,.55); }
.result.ok .ico { background: var(--up); color: #06140d; }
.result.bad { border-color: rgba(229,72,77,.6); }
.result.bad .ico { background: var(--down); color: #fff; }
.result.wait .ico { background: var(--warn); color: #1a1405; }
.result.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.97); } to { transform: none; } }

.log { display: flex; flex-direction: column; }
.log div { display: grid; grid-template-columns: 52px 1fr; gap: 8px; font-size: 13px; padding: 5px 0; border-top: 1px solid var(--line); }
.log div:first-child { border-top: 0; }
.log time { font: 12px var(--mono); color: var(--dim); }
.log .rej { color: #ff9f97; }
.log small { display: block; color: var(--dim); font-size: 12px; }

/* signals */
.sig { display: grid; gap: 8px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; }
.card .name { font: 600 12px var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.card .call { font: 700 18px var(--label); letter-spacing: .04em; }
.card .call.up { color: var(--up); } .card .call.down { color: var(--down); } .card .call.flat { color: var(--dim); }
.card .meta { grid-column: 1 / -1; font-size: 12px; color: var(--dim); }
.card .use { border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; font: 600 12px var(--label); color: var(--fg); grid-row: span 2; }
.card .use:hover { border-color: var(--gold); color: var(--gold); }
.bt { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 6px; font-size: 12px; color: var(--dim); display: grid; gap: 2px; }
.bt b { font: 600 11px var(--label); letter-spacing: .1em; text-transform: uppercase; }
.bt .v { color: var(--fg); }
.card.boom.live { border-width: 1.5px; }
.card.boom.live.up { border-color: var(--up); background: rgba(47,182,124,.07); }
.card.boom.live.down { border-color: var(--down); background: rgba(229,72,77,.07); }
.untested { justify-self: end; font: 700 10px var(--label); letter-spacing: .12em; color: var(--warn); border: 1px solid rgba(232,178,58,.5); border-radius: 999px; padding: 2px 8px; }
.card .lvls { grid-column: 1 / -1; display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); margin-top: 2px; }
.card .lvls b { font-weight: 700; color: var(--fg); }
.card .lvls b.up { color: var(--up); } .card .lvls b.down { color: var(--down); }
.meter { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--raise); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 2px; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

@media (max-width: 900px) {
  body { overflow: auto; height: auto; }
  html { height: auto; }
  header { height: auto; flex-wrap: wrap; padding: 10px 16px; gap: 10px 16px; }
  .kpis { margin-left: 0; width: 100%; justify-content: space-between; gap: 10px; }
  .kpi { align-items: flex-start; }
  main { display: flex; flex-direction: column; }
  .left { display: flex; flex-direction: column; }
  .chartwrap { height: 46vh; min-height: 280px; }
  aside { border-left: 0; border-top: 1px solid var(--line); order: -1; overflow: visible; }
  .left { order: 0; }
  .blotter { max-height: none; }
}
</style>
</head>
<body dir="ltr">
<header>
  <div class="brand"><b>GOLD DESK</b><span id="sym">XAUUSD</span></div>
  <span class="pill unknown" id="badge">…</span>
  <div class="conn" id="conn"><i></i><span id="connTxt">Connecting</span></div>
  <div class="kpis">
    <div class="kpi"><span class="eyebrow">Balance</span><b id="bal">-</b></div>
    <div class="kpi"><span class="eyebrow">Equity</span><b id="eq">-</b></div>
    <div class="kpi pl"><span class="eyebrow">Open P/L</span><b id="opl">-</b></div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main>
  <div class="left">
    <div class="chartwrap">
      <div class="chartbar">
        <div class="tfs" id="tfs"><button data-tf="M1">1m</button><button data-tf="M5">5m</button><button data-tf="M15">15m</button><button data-tf="H1">1h</button><button data-tf="H4">4h</button></div>
        <div class="ovl" id="ovl"><button data-o="kronos" title="Kronos forecast path and target"><i></i>Kronos</button><button data-o="scalper" title="Scalper zones, swing levels, signal levels and arrows"><i class="z"></i>Scalper</button><button data-o="boom" title="Boom / Crash calls: arrows, entry, SL and TP"><i class="b"></i>Boom/Crash</button></div>
      </div>
      <div id="chart"></div>
      <canvas id="zones"></canvas>
    </div>
    <section class="blotter" aria-label="Open trades">
      <div class="bhead">
        <span class="eyebrow">Open trades <b id="npos">0</b></span>
        <span class="total" id="tpl"></span>
        <button class="closeall" id="closeAll" disabled>CLOSE ALL</button>
      </div>
      <div class="btable" id="pos"></div>
    </section>
  </div>

  <aside>
    <div class="ticket">
      <button class="big sell" id="sell"><small>SELL</small><span class="px" id="bid">-</span></button>
      <div class="lotbox">
        <button id="lotUp" aria-label="More lots">+</button>
        <input id="lots" class="num" inputmode="decimal" value="0.01" aria-label="Lots">
        <button id="lotDown" aria-label="Fewer lots">−</button>
      </div>
      <button class="big buy" id="buy"><small>BUY</small><span class="px" id="ask">-</span></button>
    </div>
    <div class="spreadline"><span>Spread <b id="spr">-</b></span><span>Lots <b id="lotsTxt">0.01</b> · one click sends</span></div>

    <div class="chips" id="chips"><button>0.01</button><button>0.05</button><button>0.10</button><button>0.50</button><button>1.00</button></div>

    <details class="protect" id="protect">
      <summary>Stop loss / take profit <span class="set" id="sltpSet">none</span></summary>
      <div class="sltp">
        <label for="sl">STOP LOSS<input id="sl" class="num" inputmode="decimal" placeholder="none"></label>
        <label for="tp">TAKE PROFIT<input id="tp" class="num" inputmode="decimal" placeholder="none"></label>
      </div>
    </details>

    <div class="result" id="result"><span class="ico">✓</span><div class="what">Ready to trade</div><div class="sub">Click SELL or BUY. The order goes out at once, with no confirm box.</div></div>

    <div class="sig">
      <div class="eyebrow">Signals</div>
      <div class="card boom" id="boom" hidden></div>
      <div class="card" id="kronos"></div>
      <div class="card" id="scalper"></div>
    </div>

    <div>
      <div class="eyebrow" style="margin-bottom:4px">Your last orders</div>
      <div class="log" id="log"><div><time></time><span class="dim">Nothing sent yet.</span></div></div>
    </div>
  </aside>
</main>
<script src="lightweight-charts.standalone.production.js"></script>
<script src="app.js"></script>
</body>
</html>
